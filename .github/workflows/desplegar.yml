name: Desplegar a Cloudflare Workers

# Tres disparadores, un solo camino de despliegue:
#   push          — cada cambio de código en main
#   repository_dispatch — cuando alguien PUBLICA contenido en Sanity (ver docs/despliegue.md)
#   workflow_dispatch   — botón manual, para redesplegar sin tocar nada
#
# Se usa GitHub Actions y NO la integración git de Cloudflare (Workers Builds) para
# tener un único dueño del despliegue. Con las dos conectadas, cada push dispararía
# dos builds compitiendo por publicar la misma versión.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publicado]
  workflow_dispatch:

# Un despliegue a la vez. Si llegan dos publicaciones seguidas desde Sanity, la
# segunda espera en vez de pisar a la primera a mitad de subida.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 exige >= 22.12.0
          node-version: '22.12'
          cache: npm

      - run: npm ci

      - name: Construir
        env:
          # De build: el contenido se lee de Sanity al generar las páginas.
          # No son secretos (el project id viaja en cualquier sitio con Sanity),
          # así que van como `vars` del repositorio, no como `secrets`.
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
        run: npm run build

      - name: Desplegar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # El adaptador genera la configuración de wrangler dentro del build.
        # RESEND_API_KEY y CONTACT_EMAIL NO se pasan aquí: son secretos del worker
        # y se ponen una sola vez con `wrangler secret put` (ver docs/despliegue.md).
        run: npx wrangler deploy --config dist/server/wrangler.json
